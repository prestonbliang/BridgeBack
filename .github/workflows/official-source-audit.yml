name: Official program source audit
on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"
  push:
    branches: [main]
    paths:
      - "lib/official-catalog.json"
      - "lib/official-source-check.ts"
      - "lib/assistance-contacts.json"
      - "tests/live/assistance-contacts.spec.ts"
      - "tests/live/official-sources.spec.ts"
      - "vitest.sources.config.ts"
      - ".github/workflows/official-source-audit.yml"
permissions:
  contents: read
concurrency:
  group: official-source-audit
  cancel-in-progress: false
jobs:
  review-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run programs:audit
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: official-source-audit
          path: |
            artifacts/official-source-audit.json
            artifacts/assistance-contact-audit.json
          if-no-files-found: error
          retention-days: 30
