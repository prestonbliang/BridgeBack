name: Check a public deployment
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deployment-check.yml"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "public/**"
      - "service-worker/**"
      - "tests/e2e/**"
      - "playwright*.ts"
      - "scripts/check-deployment.mjs"
      - "vercel.json"
      - "package*.json"
      - "next.config.ts"
      - "scripts/stamp-worker.mjs"
  workflow_dispatch:
    inputs:
      public_url:
        description: "Your BridgeBack HTTPS origin, e.g. https://your-project.vercel.app"
        required: true
        type: string
        default: "https://bridge-back-one.vercel.app"
permissions:
  contents: read
concurrency:
  group: public-deployment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BRIDGEBACK_PUBLIC_URL: ${{ inputs.public_url || 'https://bridge-back-one.vercel.app' }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/deployment-browser-report.json
      BRIDGEBACK_EXPECT_REVISION: ${{ github.event_name == 'push' && github.sha || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check public HTTP, sources, assets and security headers
        run: node scripts/check-deployment.mjs
      - run: npx playwright install --with-deps chromium
      - name: Exercise real desktop, mobile and offline workflows
        run: npx playwright test --config playwright.deployment.config.ts --reporter=list,json
      - name: Publish readable verification evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lines = ["# BridgeBack public deployment verification", "", "Target: " + os.environ["BRIDGEBACK_PUBLIC_URL"], ""]
          report = Path("artifacts/deployment-check.json")
          if report.exists():
              data = json.loads(report.read_text())
              lines += ["Checked: " + data["checkedAt"], "", "Transport: " + data["transport"], ""]
              for item in data["results"]:
                  lines.append(("PASS: " if item["passed"] else "FAIL: ") + item["name"] + (" — " + item["detail"] if "detail" in item else ""))
                  if not item["passed"]:
                      detail = item.get("detail", "No detail").replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print("::error title=" + item["name"] + "::" + detail)
              lines += ["", "Source review warnings: " + str(len(data["warnings"]))]
              lines += data["warnings"]
              print("::notice title=Source-review report::" + str(len(data["warnings"])) + " source-review warnings. Page checks do not establish live assistance.")
              for warning in data["warnings"]:
                  print("::warning title=Source review::" + warning.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
              if data.get("release"):
                  print("::notice title=Published revision::" + str(data["release"]["revision"]))
          else:
              lines += ["HTTP evidence was not produced. Do not infer a pass."]
          browser = Path("artifacts/deployment-browser-report.json")
          if browser.exists():
              stats = json.loads(browser.read_text())["stats"]
              lines += ["", "Browser results: " + json.dumps(stats, sort_keys=True)]
              print("::notice title=Browser results::" + json.dumps(stats, sort_keys=True))
          else:
              lines += ["", "Browser evidence was not produced. Do not infer a pass."]
          lines += ["", "These checks do not establish agency approval, live housing availability or physical-device installation."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-deployment-check
          path: |
            artifacts/deployment-check.json
            artifacts/deployment-browser-report.json
            artifacts/deployment-browser-results/
          if-no-files-found: ignore
          retention-days: 7
