name: Check a public deployment
on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "Your BridgeBack HTTPS origin, e.g. https://your-project.vercel.app"
        required: true
        type: string
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRIDGEBACK_PUBLIC_URL: ${{ inputs.public_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check public HTTP, sources, assets and security headers
        run: node scripts/check-deployment.mjs
      - run: npx playwright install --with-deps chromium
      - name: Exercise real desktop, mobile and offline workflows
        run: npx playwright test --config playwright.deployment.config.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-deployment-check
          path: |
            artifacts/deployment-check.json
            artifacts/deployment-browser-results/
          if-no-files-found: ignore
          retention-days: 7
